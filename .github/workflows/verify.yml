name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: lenny
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: lenny_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lenny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://lenny:ci-test-only@localhost:5432/lenny_test
      - run: npm run test:agent
      - run: npm run test:ui
      - run: npm run build
