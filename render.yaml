# Free demo hosting. Optional Anthropic API usage is billed separately.
services:
  - type: web
    name: lenny-studio-free
    runtime: docker
    dockerfilePath: ./render.Dockerfile
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_USERNAME
        value: reviewer
      - key: ACCESS_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: anthropic
      - key: MODEL_TIMEOUT_SECONDS
        value: "240"
      - key: GENERATION_REQUESTS_PER_HOUR
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: lenny-database-free
          property: connectionString
      - key: AGENT_URL
        value: http://127.0.0.1:8788
      - key: AGENT_HOST
        value: 127.0.0.1
      - key: AGENT_TOKEN
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
databases:
  - name: lenny-database-free
    plan: free
    databaseName: lenny
    user: lenny
    ipAllowList: []
