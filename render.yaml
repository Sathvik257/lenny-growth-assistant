# Paid services. Review Render's displayed estimate before creating resources.
services:
  - type: pserv
    name: lenny-agent
    runtime: docker
    dockerfilePath: ./agent/Dockerfile
    plan: starter
    envVars:
      - key: AGENT_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: MODEL_TIMEOUT_SECONDS
        value: "240"
  - type: web
    name: lenny-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health/live
    preDeployCommand: python -m backend.ingest
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_USERNAME
        value: reviewer
      - key: ACCESS_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: anthropic
      - key: MODEL_TIMEOUT_SECONDS
        value: "240"
      - key: GENERATION_REQUESTS_PER_HOUR
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: lenny-database
          property: connectionString
      - key: AGENT_URL
        fromService:
          name: lenny-agent
          type: pserv
          property: hostport
      - key: AGENT_TOKEN
        fromService:
          name: lenny-agent
          type: pserv
          envVarKey: AGENT_TOKEN
      - key: ANTHROPIC_API_KEY
        fromService:
          name: lenny-agent
          type: pserv
          envVarKey: ANTHROPIC_API_KEY
      - key: ANTHROPIC_MODEL
        fromService:
          name: lenny-agent
          type: pserv
          envVarKey: ANTHROPIC_MODEL
databases:
  - name: lenny-database
    plan: basic-256mb
    databaseName: lenny
    user: lenny
    ipAllowList: []
